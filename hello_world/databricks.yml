# This is a Declarative Automation Bundle definition for hello_world.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: hello_world
  uuid: 72436e9e-2134-4586-8acd-c3854abb53a4

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-472c49cc-2cf6.cloud.databricks.com
    variables:
      catalog: workspace
      schema: hello_world_dev
  prod:
    mode: production
    workspace:
      host: https://dbc-472c49cc-2cf6.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/bartosz.papinski@capgemini.com to make sure we only have a single copy.
      root_path: /Workspace/Users/bartosz.papinski@capgemini.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: bartosz.papinski@capgemini.com
        level: CAN_MANAGE
